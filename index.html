<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Anmol 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fde8ef;--deep:#8f3558;--rose:#e0507a;--cream:#fff8f0}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);font-family:'Quicksand',sans-serif;color:var(--deep);overflow:hidden}
.page{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.page.on{display:flex;animation:fi .6s}
@keyframes fi{from{opacity:0}}
/* a box that keeps the artwork's aspect ratio so hotspots line up */
.box{position:relative;width:min(100vw,calc(100vh*var(--ar)));aspect-ratio:var(--ar)}
.box>img:not(.knife):not(.slice),.box>video{position:absolute;inset:0;width:100%;height:100%;display:block}
.hot{position:absolute;background:none;border:0;cursor:pointer;border-radius:8px}
#d31{animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #ff3b3055,0 0 18px #ff3b3088}}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.toast{position:fixed;left:50%;bottom:8%;transform:translate(-50%,20px);background:var(--cream);border:2px solid var(--rose);border-radius:20px;padding:8px 18px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tapnote{position:absolute;left:0;right:0;bottom:2.5%;text-align:center;pointer-events:none}
/* nav */
nav{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;z-index:10;display:none;justify-content:center;gap:8px;padding:8px;background:#fde8efe6;backdrop-filter:blur(6px);border-bottom:2px dashed #f4b3c8;flex-wrap:wrap}
nav.on{display:flex}
nav button{font:700 14px 'Quicksand';color:var(--deep);background:var(--cream);border:2px solid var(--rose);border-radius:18px;padding:7px 14px;cursor:pointer}
nav button.act{background:var(--rose);color:#fff}
.tab{display:none;width:100%;height:100%}.tab.on{display:flex;align-items:center;justify-content:center}
#tCake{padding-top:52px}
/* cake stage */
.box.cake{--ar:1.7778}
#vOut{opacity:1}#vLit{transition:opacity .7s}
.blown #vLit{opacity:0}
.knife{position:absolute;width:14%;height:auto;left:14%;top:43%;touch-action:none;cursor:grab;filter:drop-shadow(0 4px 4px #0003);z-index:5;animation:kw 1.6s infinite;user-select:none;-webkit-user-drag:none}
.knife.drag{animation:none;cursor:grabbing;filter:drop-shadow(0 10px 8px #0004)}
@keyframes kw{50%{transform:rotate(-5deg) translateY(-4px)}}
.puff{position:absolute;width:3%;aspect-ratio:1;border-radius:50%;background:#fff;opacity:0;filter:blur(3px);pointer-events:none;z-index:4}
.blown .puff{animation:puff 2.2s forwards}
@keyframes puff{0%{opacity:.9;transform:translateY(0) scale(.5)}100%{opacity:0;transform:translateY(-90px) scale(2.4)}}
.slice{position:absolute;left:52.6%;top:42.2%;width:9.2%;height:auto;opacity:0;z-index:4;filter:drop-shadow(0 3px 3px #5a2a3c55)}
.cut .slice{animation:slice 1.3s forwards}
@keyframes slice{0%{opacity:0;transform:none}12%{opacity:1;transform:none}100%{opacity:1;transform:translate(10%,26%) rotate(5deg) scale(1.06)}}
.hint{position:absolute;left:0;right:0;top:13.5%;text-align:center;font:600 clamp(20px,3.2vw,34px) 'Caveat';color:var(--deep);pointer-events:none;transition:opacity .4s}
.cf{position:fixed;top:-16px;animation:cf linear forwards;pointer-events:none;z-index:20}
@keyframes cf{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
.soon{text-align:center;padding:24px;max-width:420px}
.soon h2{font:600 44px 'Caveat';margin-bottom:8px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body>

  </div>
  <div class="tab" id="tBouq"><div class="soon"><h2>💐 Bouquet</h2><p>Coming soon, the duck is still picking flowers 🦆</p></div></div>
  <div class="tab" id="tLet"><div class="soon"><h2>💌 Letter</h2><p>Your letter goes here (we'll write it next!)</p></div></div>
  <div class="tab" id="tSur"><div class="soon"><h2>🎁 Special Surprise</h2><p>Something extra special is on its way…</p></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const go=id=>{$$('.page').forEach(p=>p.classList.remove('on'));$(id).classList.add('on');$('#nav').classList.toggle('on',id==='#pMain')};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)};

// splash -> calendar
$('#pSplash').onclick=()=>go('#pCal');

// calendar hotspots (Oct 1 2026 = Thursday; grid measured from the artwork, in %)
(function(){
  const X0=114/2000*100,CW=253.1/2000*100,Y=[388,571,754,938,1121,1304].map(v=>v/1414*100);
  let h='';for(let d=1;d<=31;d++){const idx=d+3,c=idx%7,r=Math.floor(idx/7);
    h+=`<button class="hot" ${d===31?'id="d31"':''} data-d="${d}" aria-label="October ${d}" style="left:${X0+c*CW}%;top:${Y[r]}%;width:${CW}%;height:${Y[r+1]-Y[r]}%"></button>`}
  $('#hots').innerHTML=h;
  $('#hots').onclick=e=>{const b=e.target.closest('.hot');if(!b)return;
    if(b.dataset.d==='31'){go('#pMain');startVid()}
    else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');toast('not that one… find the red circle 💗')}};
})();

// nav tabs
$$('nav button').forEach(b=>b.onclick=()=>{$$('nav button').forEach(x=>x.classList.remove('act'));b.classList.add('act');
  $$('.tab').forEach(t=>t.classList.remove('on'));$('#'+b.dataset.t).classList.add('on');if(b.dataset.t==='tCake')startVid()});

// videos: both play in sync, the "blown" one sits underneath
const vL=$('#vLit'),vO=$('#vOut'),stage=$('#stage');
function startVid(){vL.play().catch(()=>{});vO.play().catch(()=>{});}
setInterval(()=>{if(Math.abs(vL.currentTime-vO.currentTime)>.15)vO.currentTime=vL.currentTime},500);

// candle smoke positions (% of stage)
[[42.2,23],[46.7,23],[50.5,23],[44.5,27.5],[54.8,26],[49.9,30]].forEach(([x,y])=>{
  const p=document.createElement('div');p.className='puff';p.style.cssText=`left:${x}%;top:${y}%`;stage.appendChild(p)});

// happy birthday tune
const F={C:261.6,D:293.7,E:329.6,F:349.2,G:392,A:440,B:493.9,H:523.3};
const S=[['G',.4],['G',.2],['A',.6],['G',.6],['H',.6],['B',1.1],['G',.4],['G',.2],['A',.6],['G',.6],['D',.6],['H',1.1],['G',.4],['G',.2],['G',.6],['E',.6],['H',.6],['B',.6],['A',1.1],['F',.4],['F',.2],['E',.6],['H',.6],['D',.6],['H',1.4]];
function tune(){const ac=new (window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime+.1;
  S.forEach(([n,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=F[n];
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d*.95);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);t+=d})}
function hearts(){const C=['#ff7aa8','#ffb3cc','#fff1b8','#ffd24a','#b9a6f0','#8fd3f4','#ff5c8a','#fff'];
  for(let i=0;i<90;i++){const c=document.createElement('div');c.className='cf';const w=6+Math.random()*8;
    c.style.cssText=`left:${Math.random()*100}vw;width:${w}px;height:${Math.random()<.4?w:w*1.8}px;background:${C[i%C.length]};border-radius:${Math.random()<.35?'50%':'2px'};--dx:${(Math.random()*160-80)|0}px;--rot:${(Math.random()*900|0)+360}deg;animation-duration:${2.4+Math.random()*2.6}s;animation-delay:${Math.random()*.8}s`;
    document.body.appendChild(c);setTimeout(()=>c.remove(),6500)}}

// draggable knife
const K=$('#knife'),hint=$('#hint');let drag=null,blown=false,cut=false,home=null;
const CAKE={x:[33,66],y:[32,66]};          // cake area, % of stage
K.addEventListener('pointerdown',e=>{if(cut)return;const r=stage.getBoundingClientRect(),k=K.getBoundingClientRect();
  home=home||{l:K.style.left||'14%',t:K.style.top||'43%'};
  drag={dx:e.clientX-k.left,dy:e.clientY-k.top};K.setPointerCapture(e.pointerId);K.classList.add('drag')});
K.addEventListener('pointermove',e=>{if(!drag)return;const r=stage.getBoundingClientRect();
  const l=(e.clientX-drag.dx-r.left)/r.width*100,t=(e.clientY-drag.dy-r.top)/r.height*100;
  K.style.left=Math.max(-2,Math.min(92,l))+'%';K.style.top=Math.max(0,Math.min(86,t))+'%';
  // knife tip (top-right of sprite) over cake?
  const cx=l+14*.8,cy=t+(14*228/280*1.7778)*.15;
  if(cx>CAKE.x[0]&&cx<CAKE.x[1]&&cy>CAKE.y[0]&&cy<CAKE.y[1]){
    if(!blown){blown=true;stage.classList.add('blown');tune();hearts();hint.textContent='make a wish… 🎂';
      setTimeout(doCut,1000)}}});
function doCut(){if(cut)return;cut=true;drag=null;K.classList.remove('drag');
  K.style.transition='left .5s,top .5s';K.style.left='50%';K.style.top='33%';
  setTimeout(()=>{stage.classList.add('cut');hint.textContent='the first slice is for you 💗'},500);
  setTimeout(()=>{K.style.transition='left .9s,top .9s';K.style.left='66%';K.style.top='22%';hearts()},2200)}
K.addEventListener('pointerup',()=>{drag=null;K.classList.remove('drag')});
</script></body></html>
